name: GigBid CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic requests pytest jinja2 pyyaml python-multipart

      - name: Run Unit Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/unit mcp_servers -v

      - name: Run MCP Contract Snapshot Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/contract -v

      - name: Run Multi-Agent Integration Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/integration -v
