marketplace:
  mode: "gigsim" # "gigsim" or "upwork_live"
  poll_interval_seconds: 120
  min_connects_reserve: 10
  auto_skip_low_fit_threshold: 0.35

budgets:
  max_steps_per_thread: 15
  max_tokens_per_thread: 16000
  max_critic_iterations: 2
  cost_ceiling_per_proposal_usd: 0.05
