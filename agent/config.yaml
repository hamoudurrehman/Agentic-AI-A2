  paid:
    scout: "gpt-oss-20b"
    job_analyst: "gpt-oss-20b"
    risk_assessor: "gpt-oss-20b"
    fit_matcher: "gpt-oss-120b"
    pricing_strategist: "gpt-oss-20b"
