active_profile: open

profiles:
  open:
    scout: "qwen3:4b"
    job_analyst: "qwen3:8b"
    risk_assessor: "qwen3:4b"
    fit_matcher: "qwen3:8b"
    pricing_strategist: "qwen3:8b"
    proposal_writer: "qwen-3.6-27b-q4"
    verifier: "qwen3:8b"
