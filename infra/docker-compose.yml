version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: gigbid/infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MARKETPLACE_MODE=gigsim
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://gigbid:gigbidpass@postgres:5432/gigbid_db
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ..
      dockerfile: gigbid/infra/docker/Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MARKETPLACE_MODE=gigsim
    depends_on:
      - redis
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gigbid
      POSTGRES_PASSWORD: gigbidpass
      POSTGRES_DB: gigbid_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  pgdata:
  ollama_models:
